  <script>
    const cases = [
      {
        id:'icu', no:'CASE 01', title:'最后一张监护床', short:'资源分配', color:'#ff8b7b', duration:'约 8 分钟',
        intro:'两位患者几乎同时需要升级监护，而院内只剩下一张重症床位。你的任务不是挑选“更值得”的人，而是让稀缺资源的分配有一致标准、可说明、能复核。',
        stakeholders:['林女士 · 需要呼吸支持','周先生 · 病情快速进展','重症团队 · 承担床位决策','仍在候床的其他患者'],
        questions:[
          {title:'先把尺子摆到桌面上',situation:'林女士 42 岁，是两名孩子的母亲；周先生 68 岁，是退休教师。两人都可能受益，但病历中的社会身份格外醒目。',lens:'当前任务：确定第一步，而不是直接点名谁入床。',prompt:'值班团队首先应当怎么做？',hint:'把“谁更有价值”换成“哪些临床相关条件可以对所有人一致使用”。',answer:'b',reason:'稀缺资源分配应基于公开、一致、与临床获益相关的标准，并尽量避免把社会价值、财富、职业或家庭角色当作优先依据。',options:[{id:'a',label:'优先林女士，因为她还有年幼孩子',feedback:'照顾者身份令人动容，但以家庭角色衡量人的价值，会让标准无法一致适用于所有患者。'},{id:'b',label:'先使用预先约定的临床获益标准评估两人，并记录依据',feedback:'正确。先固定与临床获益相关的共同标准，才能减少临场偏见并支持复核。'},{id:'c',label:'优先周先生，因为他先由急诊提出申请',feedback:'“先到先得”有时简单，却可能把转运、信息和资源差异放大；在重症资源分配中不应自动取代临床标准。'}]},
          {title:'当分数仍然相同',situation:'复核后，两人的短期获益判断非常接近，差异落在评估误差内。团队开始争论谁“贡献更大”。',lens:'当前任务：在相关条件相同的情况下选择次级规则。',prompt:'哪种处理更能保持程序公平？',hint:'当可靠标准分不出高下时，次级规则应尽量少引入新的偏见。',answer:'c',reason:'当患者在相关临床标准上无法区分时，可采用预先公布的平等机会程序，例如抽签，并完整记录过程。具体规则应遵循机构政策。',options:[{id:'a',label:'比较两人的职业与社会贡献',feedback:'社会贡献难以客观比较，也会系统性贬低失业者、照护者与边缘群体。'},{id:'b',label:'让最资深的医生凭直觉决定',feedback:'经验重要，但不可解释的个人直觉不是可复核的共同程序。'},{id:'c',label:'按机构预案启动平等机会的抽签，并由第二人见证',feedback:'正确。预设、透明、可见证的随机程序避免临场加入新的身份权重。'}]},
          {title:'利益冲突出现了',situation:'负责复核的医生认出周先生是自己多年的导师，并表示自己“绝不会受影响”。',lens:'当前任务：保护决策的可信度，而不是判断这位医生的人品。',prompt:'团队最合适的下一步是什么？',hint:'偏见未必是故意的；程序可以同时保护患者与医生。',answer:'a',reason:'披露潜在利益冲突并由独立人员接手关键复核，能降低实际偏差与不信任，也保护原评估者。',options:[{id:'a',label:'记录关系，由无直接关系的同事完成复核',feedback:'正确。回避关键复核是一项程序保障，并不等于指控医生不诚实。'},{id:'b',label:'相信专业自律，继续由原医生做最终决定',feedback:'自律不能替代对明显利益冲突的程序管理。'},{id:'c',label:'把这段关系告诉两位患者，让他们自行协商',feedback:'透明很重要，但将稀缺资源的冲突直接转嫁给患者并不能产生公平程序。'}]},
          {title:'决定之后仍有责任',situation:'抽签后林女士进入重症床位。周先生留在普通病房，家属认为“医院已经放弃他”。',lens:'当前任务：区分资源未分配与照护终止。',prompt:'团队应如何回应并继续照护？',hint:'没有获得某项稀缺资源，不等于失去所有治疗与尊严。',answer:'b',reason:'分配决定应附带清楚说明、复核或申诉路径、持续的替代治疗与症状照护；床位也应按预设时间和临床变化重新评估。',options:[{id:'a',label:'强调规则已经结束讨论，避免给家属错误希望',feedback:'程序不能只在做决定时透明；关闭沟通会加深被遗弃感，也遗漏复核与持续照护。'},{id:'b',label:'解释依据与复核路径，继续替代治疗和舒缓支持，并按规则再评估',feedback:'正确。公平不止是“谁得到”，也包括说明、复核与对所有人的持续照护。'},{id:'c',label:'承诺下一张床位一定给周先生作为补偿',feedback:'提前承诺会绕开下一轮所有候选人的共同标准，也可能给出无法兑现的保证。'}]}
      ]},
      {
        id:'privacy', no:'CASE 02', title:'不想让父母知道', short:'保密边界', color:'#80bfff', duration:'约 8 分钟',
        intro:'16 岁的晓雨独自来取遗传检测结果。她反复确认父母不会知道。你需要在隐私、理解能力、家庭支持与潜在伤害之间逐步判断，而不是把“保密”当成一句绝对承诺。',
        stakeholders:['晓雨 · 16 岁，就诊者','父母 · 主要照护者','遗传咨询师 · 解释风险','临床团队 · 负有保密与安全责任'],
        questions:[
          {title:'承诺之前先说明边界',situation:'晓雨开口第一句是：“只要你保证绝不告诉我爸妈，我才听结果。”她神情紧张，但能清楚复述来诊原因。',lens:'当前任务：建立可以信任的谈话框架。',prompt:'最合适的回应是什么？',hint:'信任不来自无限承诺，而来自提前说清规则与例外。',answer:'a',reason:'应先用适龄语言解释保密原则及其有限例外，评估她的理解与决策能力，并询问她最担心什么。具体权限取决于当地法律和机构政策。',options:[{id:'a',label:'说明通常会保护隐私及少数安全例外，再确认她的理解与担忧',feedback:'正确。清楚边界、评估理解并探索担忧，能避免后来突然“违背承诺”。'},{id:'b',label:'先无条件保证保密，拿到信任后再说例外',feedback:'无法兑现的绝对保证会损害信任，也掩盖了真实的安全边界。'},{id:'c',label:'她未满 18 岁，所以拒绝单独谈话',feedback:'年龄本身不足以回答全部问题。应结合决策能力、就诊事项、当地规则与安全风险判断。'}]},
          {title:'家长在门外追问',situation:'谈话尚未结束，晓雨的父亲在门外问护士：“结果是不是很严重？我是监护人，我有权知道。”',lens:'当前任务：在压力下保持最小必要披露。',prompt:'团队此时应怎么做？',hint:'可以解释流程，不等于必须透露具体结果。',answer:'c',reason:'先不在走廊透露具体结果，转到合适环境核对授权、法律与机构政策；同时继续与晓雨讨论可接受的家庭参与方式。',options:[{id:'a',label:'立即把报告交给父亲，避免家庭冲突升级',feedback:'便利和压力不能自动替代保密评估；走廊也不是合适的披露环境。'},{id:'b',label:'告诉父亲“无可奉告”，并终止沟通',feedback:'保护隐私并不要求拒绝所有沟通。可以说明一般流程、承诺核对规则并安排后续。'},{id:'c',label:'先不透露结果，核对授权与规则，并和晓雨讨论怎样获得支持',feedback:'正确。先守住具体信息，再通过授权、政策与共同计划寻找支持。'}]},
          {title:'结果也关系到家人',situation:'结果提示一种可干预的遗传风险，可能也影响血缘亲属。晓雨说，她害怕父母责怪自己，暂时不愿告知。没有迹象表明危险迫在眉睫。',lens:'当前任务：促进有益披露，同时避免过早突破保密。',prompt:'优先采取哪一步？',hint:'先理解“不愿说”的原因，往往比直接对抗更能推动安全披露。',answer:'b',reason:'在非迫近危险下，应先提供遗传咨询、探索恐惧、讨论对亲属的意义，并设计由她参与的披露方案；若冲突持续，再按政策寻求伦理与法律咨询。',options:[{id:'a',label:'立刻通知所有可能受影响的亲属',feedback:'对亲属有益并不自动授权广泛披露；应先用更少侵入的方式支持当事人参与告知。'},{id:'b',label:'探索她的担忧，提供咨询并共同设计可控的告知方案',feedback:'正确。支持式、分阶段的披露更尊重自主，也更可能真正把风险信息带给家人。'},{id:'c',label:'完全不再提家人，因为保密高于一切',feedback:'保密很重要，但团队仍应解释结果对他人的可能意义，并支持负责任的沟通。'}]},
          {title:'风险突然变了',situation:'谈到家庭反应时，晓雨说自己已准备好大量药物，“今晚就结束”。她说出了地点、时间和方法，并拒绝任何人介入。',lens:'当前任务：识别保密边界已发生变化。',prompt:'此时最合适的处理是？',hint:'当严重且迫近的伤害风险具体化时，保密不再是唯一要保护的利益。',answer:'a',reason:'具体、迫近的自伤计划需要立即启动安全评估与保护流程，并只向需要参与保护的人披露必要信息，同时尽量告知晓雨接下来会发生什么。',options:[{id:'a',label:'说明需要启动安全保护，联系必要人员并持续陪伴评估',feedback:'正确。最小必要披露、透明说明与不中断陪伴，可以同时保护安全和尽量维护信任。'},{id:'b',label:'继续保密，因为她明确拒绝告知任何人',feedback:'面对具体且迫近的严重伤害风险，绝对保密可能让可预防的伤害发生。'},{id:'c',label:'先让她独自回家冷静，明天再电话随访',feedback:'已有明确计划、方法与时间，延迟并让她独处并不匹配当前风险。'}]}
      ]},
      {
        id:'consent', no:'CASE 03', title:'签字之前', short:'知情同意', color:'#f2c66d', duration:'约 8 分钟',
        intro:'一项新药研究正在招募患者。签字页已经打印好，但真正的同意不是一张纸：它需要理解、选择能力、自愿和持续沟通。你要识别那些“看起来配合、其实没有选择”的时刻。',
        stakeholders:['陈先生 · 候选参与者','女儿 · 主要陪护','研究医生 · 同时参与临床照护','研究协调员 · 负责招募'],
        questions:[
          {title:'“您听懂了吗？”还不够',situation:'研究医生连续讲了十五分钟术语。陈先生点头说“都懂”，但把随机分组理解成医生会替他选择最好的方案。',lens:'当前任务：验证理解，而不是获得一句“懂了”。',prompt:'下一步最合适的是？',hint:'让对方用自己的话讲回来，比让他回答“是/否”更能发现误解。',answer:'b',reason:'应暂停签字，用通俗语言重新解释随机分组、风险、替代方案和退出权，再用复述法确认理解。',options:[{id:'a',label:'他已经说懂了，直接请他签字',feedback:'点头和签字不能证明理解；这里已经出现了对随机分组的关键误解。'},{id:'b',label:'重新解释并请他用自己的话说明研究、选择和替代方案',feedback:'正确。复述法把检查重点从“是否听过”转向“如何理解”。'},{id:'c',label:'让女儿替他听懂即可，患者本人不必掌握细节',feedback:'支持者可以帮助，但只要患者有能力作决定，就不能用家属理解替代本人理解。'}]},
          {title:'治疗与研究不是一回事',situation:'陈先生说：“您是我的主治医生，既然推荐这个试验，就说明它一定比常规治疗好。”',lens:'当前任务：处理“治疗性误解”。',prompt:'研究医生应如何回应？',hint:'重点是说清研究的不确定性，以及“不参加”仍可获得什么。',answer:'c',reason:'需要明确研究旨在产生一般知识，个体获益并不确定；说明常规治疗和不参加的后果，并避免利用医患关系施压。',options:[{id:'a',label:'不纠正，以免打击他参与的积极性',feedback:'保留关键误解会让同意建立在错误期待上。'},{id:'b',label:'强调这是难得机会，名额很快就满',feedback:'稀缺感会增加压力，也没有纠正“研究一定更好”的误解。'},{id:'c',label:'说明获益不确定、存在替代方案，不参加也不影响应有照护',feedback:'正确。把研究与个体化治疗区分开，才能保护自愿选择。'}]},
          {title:'翻译不能只靠家属',situation:'陈先生主要使用另一种语言。女儿说自己翻译最快，并在父亲回答前替他作答。团队今天可以联系到专业口译。',lens:'当前任务：让患者本人的声音进入决定。',prompt:'团队应优先怎么做？',hint:'家庭支持可以保留，但关键医学信息需要准确、中立地传递。',answer:'a',reason:'应使用合格口译并直接对患者说话，确认患者希望女儿参与到什么程度；这能减少遗漏、过滤和角色冲突。',options:[{id:'a',label:'安排专业口译，直接与陈先生交流，并询问他希望女儿如何参与',feedback:'正确。专业口译与患者授权的家庭支持可以并存。'},{id:'b',label:'只让女儿翻译，因为她最了解父亲',feedback:'熟悉并不保证中立和完整，也可能让患者难以表达与家庭不同的意愿。'},{id:'c',label:'给一份翻译后的文件，让他回家自行阅读即可',feedback:'书面材料有帮助，但不能替代双向沟通、提问和理解确认。'}]},
          {title:'时间紧迫也不能把门槛拿走',situation:'后来一位候选患者意识不清、没有可联系的代理人。研究药必须在两小时内使用才符合方案，但该研究并未获准在无法同意时例外入组。',lens:'当前任务：区分临床急迫与研究授权。',prompt:'团队应怎么做？',hint:'“来不及”不会自动创造研究入组许可。',answer:'b',reason:'在没有有效同意、代理授权或经批准的例外机制时，应停止研究入组，提供适当的标准临床照护，并记录与咨询研究监督方。',options:[{id:'a',label:'先入组，等患者清醒后再补签',feedback:'事后补签不能自动修复未经授权的研究介入；时间窗本身不是例外依据。'},{id:'b',label:'不纳入研究，先给予标准照护，并按方案报告与咨询',feedback:'正确。急迫需要迅速临床照护，但不能自行改写研究的同意条件。'},{id:'c',label:'由在场两名医生代替患者签署研究同意',feedback:'医生见证不能替代患者或合法代理人的授权，除非已有明确、经批准的例外机制。'}]}

    const sampleComments=[
      {caseId:'icu',nickname:'带教老师',rating:5,body:'最难的不是抽签，而是先承认有些差异并不足以支持精确排序。',date:'示例留言'},
      {caseId:'consent',nickname:'研究协调员',rating:4,body:'复述法让我意识到，“我讲完了”和“对方理解了”之间还有很远。',date:'示例留言'}
    ];
    const keys={progress:'whitecoat-progress-v1',comments:'whitecoat-comments-v1'};
    let state={view:'shelf',caseId:null,q:0,answers:[],feedback:null,hint:false,comment:{caseId:'icu',nickname:'',rating:5,body:''},preview:false,toast:''};
    function read(key,fallback){try{const value=JSON.parse(localStorage.getItem(key));return value??fallback}catch{return fallback}}
    function write(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch{return false}}
    function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function getProgress(){return read(keys.progress,{})}
    function getComments(){return read(keys.comments,[])}
    function caseById(id){return cases.find(c=>c.id===id)}
    function announce(message){document.getElementById('live').textContent=message}
    function toast(message){state.toast=message;render();setTimeout(()=>{if(state.toast===message){state.toast='';render()}},2300)}
    function header(){return `<header class="sitebar"><button class="brand" data-action="home" aria-label="返回案例列表"><span class="mark">✚</span><span>白袍之间</span></button><nav class="nav" aria-label="主导航"><button data-action="nav-cases">案例</button><button data-action="nav-history">成绩</button><button data-action="nav-comments">留言</button><span class="save-pill hide-mobile">仅保存在本机</span></nav></header>`}
    function render(){const app=document.getElementById('app');app.innerHTML=header()+(state.view==='player'?playerView():state.view==='result'?resultView():shelfView())+(state.toast?`<div class="toast" role="status">${esc(state.toast)}</div>`:'');bindFields()}
    function shelfView(){
      const progress=getProgress();const completed=cases.filter(c=>progress[c.id]?.bestScore!=null).length;const scores=cases.map(c=>progress[c.id]?.bestScore).filter(Number.isFinite);const avg=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):'—';
      return `<main class="shell"><section class="intro" id="cases"><div><p class="eyebrow">ON CALL · ETHICS DESK</p><h1>今天，答案<br>不只一种。</h1></div><div><p class="intro-copy">你是医院伦理支持组的新成员。三份会诊单已经送到桌上。每一次选择，都要同时照看患者的意愿、福祉、风险与公平。</p><div class="shift-card"><div class="metric"><strong>03</strong><span>独立案例</span></div><div class="metric"><strong>${completed}</strong><span>已经结案</span></div><div class="metric"><strong>${avg}</strong><span>最佳均分</span></div></div></div></section><div class="section-head"><div><p class="eyebrow">值班会诊单</p><h2>从一份病例开始</h2></div><p>每案 4 次抉择 · 速度不计分</p></div><section class="case-grid" aria-label="选择伦理案例">${cases.map((c,i)=>caseCard(c,i,progress[c.id])).join('')}</section><p class="note">计分：首次独立答对 100%，纠错后答对 60%，查看提示后答对 30%。每题等权，阅读时间不计分。</p>${historySection(progress)}${commentSection()}</main>`
    }
    function caseCard(c,i,p){return `<article class="case" style="--case-color:${c.color}"><div class="case-top"><span class="case-no">${c.no}</span><span class="case-status">${p?.bestScore!=null?'已结案':'待处理'}</span></div><h3>${c.title}</h3><p>${c.intro.split('。')[0]}。</p><div class="chips"><span class="chip">${c.short}</span><span class="chip">${c.questions.length} 个抉择</span><span class="chip">${c.duration}</span></div>${p?.bestScore!=null?`<div class="case-score"><strong>${p.bestScore}</strong><span>历史最佳</span></div>`:''}<div class="play"><button class="primary" data-action="start" data-case="${c.id}">${p?.bestScore!=null?'重访案例':'打开会诊单'} →</button></div></article>`}
    function historySection(progress){const rows=[];cases.forEach(c=>(progress[c.id]?.history||[]).slice().reverse().slice(0,3).forEach(h=>rows.push({...h,title:c.title})));rows.sort((a,b)=>b.ts-a.ts);return `<section class="history" id="history"><div class="section-head"><div><p class="eyebrow">个人成绩册</p><h2>只和上一次的自己比较</h2></div><p>每个案例保留最近 3 次记录</p></div>${rows.length?`<div class="history-list"><div class="history-row head"><span>案例</span><span>得分</span><span>首次答对</span><span>完成时间</span></div>${rows.map(r=>`<div class="history-row"><span>${esc(r.title)}</span><strong>${r.score}</strong><span>${r.first}/${r.total}</span><span>${formatDate(r.ts)}</span></div>`).join('')}</div>`:`<div class="empty">完成任一案例后，成绩会出现在这里。</div>`}</section>`}
    function commentSection(){const comments=[...getComments()].reverse().concat(sampleComments);const d=state.comment;return `<section class="guestbook" id="comments"><div class="section-head"><div><p class="eyebrow">交班留言簿</p><h2>留下你仍在追问的事</h2></div><p>留言仅保存在这台设备</p></div><div class="guest-layout"><form class="comment-form" id="comment-form"><label class="field"><span>案例</span><select name="caseId">${cases.map(c=>`<option value="${c.id}" ${d.caseId===c.id?'selected':''}>${c.title}</option>`).join('')}</select></label><label class="field"><span>署名</span><input name="nickname" maxlength="20" value="${esc(d.nickname)}" placeholder="例如：夜班实习生"></label><span class="note">这次体验</span><div class="stars" role="group" aria-label="星级评分">${[1,2,3,4,5].map(n=>`<button type="button" class="star ${n<=d.rating?'on':''}" data-action="rate" data-rating="${n}" aria-label="${n} 星">★</button>`).join('')}</div><label class="field"><span>留言</span><textarea name="body" maxlength="240" placeholder="哪一步让你犹豫？你还想补充什么？">${esc(d.body)}</textarea></label>${state.preview?commentPreview(d):''}<div class="form-actions">${state.preview?`<button type="button" class="primary small" data-action="save-comment">确认保存</button><button type="button" class="outline" data-action="edit-comment">继续修改</button>`:`<button type="button" class="primary small" data-action="preview-comment">预览留言</button>`}</div></form><div class="comment-list" aria-label="留言列表">${comments.length?comments.map(commentCard).join(''):`<div class="empty">还没有留言。结案后写下第一条追问吧。</div>`}</div></div></section><div class="source-note">设计参考：<a href="https://www.wma.net/policies-post/wma-declaration-of-helsinki/" target="_blank" rel="noreferrer">《赫尔辛基宣言》</a><a href="https://www.unesco.org/en/legal-affairs/universal-declaration-bioethics-and-human-rights" target="_blank" rel="noreferrer">UNESCO 生物伦理宣言</a><a href="https://www.who.int/publications/i/item/9789240029200" target="_blank" rel="noreferrer">WHO 健康人工智能伦理指南</a><br>本游戏用于伦理讨论教学，不提供个案医疗或法律意见；实际处理请遵循所在地法律、机构政策与专业支持流程。</div>`}
    function commentPreview(d){const c=caseById(d.caseId);return `<div class="preview-box"><span class="case-no">留言预览 · ${c?.title||''}</span><p><strong>${esc(d.nickname||'匿名值班员')}</strong> <span class="rating">${'★'.repeat(d.rating)}${'☆'.repeat(5-d.rating)}</span></p><p>${esc(d.body)||'<span class="note">尚未填写留言</span>'}</p></div>`}
    function commentCard(c){return `<article class="comment-card"><div class="comment-meta"><span>${esc(c.nickname)} · ${esc(caseById(c.caseId)?.title||'案例')}</span><span>${esc(c.date||formatDate(c.ts))}</span></div><div class="rating" aria-label="${c.rating} 星">${'★'.repeat(c.rating)}${'☆'.repeat(5-c.rating)}</div><blockquote>${esc(c.body)}</blockquote></article>`}
    function playerView(){const c=caseById(state.caseId),q=c.questions[state.q],a=state.answers[state.q]||{attempts:0,wrong:[],hint:false,correct:false,points:0};const pct=Math.round((state.q/c.questions.length)*100);return `<main class="player" style="--case-color:${c.color}"><div class="player-top"><button class="back" data-action="home">← 返回值班簿</button><div class="progress-wrap"><span>${state.q+1} / ${c.questions.length}</span><div class="progress" aria-label="案例进度"><span style="width:${pct}%"></span></div></div></div><div class="player-grid"><aside class="docket"><span class="case-no">${c.no} · ${c.short}</span><h1>${c.title}</h1><p>${c.intro}</p><ul class="stakeholders">${c.stakeholders.map(s=>`<li>${s}</li>`).join('')}</ul></aside><article class="question"><span class="q-label">会诊记录 ${String(state.q+1).padStart(2,'0')} · ${q.title}</span><p class="situation">${q.situation}</p><div class="lens">${q.lens}</div><h2>${q.prompt}</h2><div class="options">${q.options.map((o,i)=>optionButton(o,i,a)).join('')}</div><div class="assist"><button class="hint-btn" data-action="hint" ${a.correct?'disabled':''}>${a.hint?'提示已查看':'查看一条提示（本题最高 30 分）'}</button><span class="note">可重新作答</span></div>${a.hint?`<p class="hint">${q.hint}</p>`:''}${state.feedback?feedbackBox(state.feedback,a.correct,q):''}</article></div></main>`}
    function optionButton(o,i,a){const cls=a.correct&&o.id===a.choice?'correct':a.wrong.includes(o.id)?'wrong':'';return `<button class="option ${cls}" data-action="answer" data-choice="${o.id}" ${a.correct||a.wrong.includes(o.id)?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${o.label}</span></button>`}
    function feedbackBox(f,correct,q){return `<div class="feedback ${correct?'good':'bad'}" role="status"><strong>${correct?'判断成立':'再看一眼证据'}</strong><p>${f}</p>${correct?`<div class="next"><button data-action="next">${state.q===caseById(state.caseId).questions.length-1?'完成案例':'下一页 →'}</button></div>`:''}</div>`}
    function resultData(){const c=caseById(state.caseId),answers=state.answers;const score=Math.round(answers.reduce((s,a)=>s+(a?.points||0),0)/c.questions.length);const first=answers.filter(a=>a&&!a.hint&&a.attempts===0).length;const hinted=answers.filter(a=>a?.hint).length;const corrected=c.questions.length-first-hinted;return{c,score,first,hinted,corrected}}
    function resultView(){const {c,score,first,hinted,corrected}=resultData();const title=score>=90?'你守住了程序，也看见了人':score>=70?'判断正在变得有根据':score>=50?'分歧已经浮出水面':'值得回到关键节点再看一次';return `<main class="result-shell" style="--case-color:${c.color}"><section class="result-hero"><div class="score-ring"><strong>${score}</strong><span>ETHICS SCORE</span></div><div class="result-copy"><p class="eyebrow">${c.no} · 已结案</p><h1>${title}</h1><p>这不是人格测验。分数只记录你在本轮中如何使用证据、纠错和提示。</p><div class="count-row"><div class="count"><strong>${first}</strong><span>首次独立答对</span></div><div class="count"><strong>${corrected}</strong><span>纠错后答对</span></div><div class="count"><strong>${hinted}</strong><span>借助提示掌握</span></div></div><div class="result-actions"><button class="primary small" data-action="result-comment">写下留言</button><button class="outline" data-action="restart">再玩一次</button><button class="outline" data-action="home">返回值班簿</button></div></div></section><section class="review"><h2>本轮推理记录</h2>${c.questions.map((q,i)=>{const a=state.answers[i];return `<div class="review-item"><span class="case-no">${String(i+1).padStart(2,'0')}</span><div><strong>${q.title}</strong><div class="note">${a.hint?'看过提示':a.attempts?'经过纠错':'首次答对'}</div></div><span class="review-points">${a.points} 分</span></div>`}).join('')}</section><div class="source-note">实际医学伦理决策会受到具体病情、法律、机构政策与文化语境影响。本案例用于讨论过程，不替代专业会诊。</div></main>`}
    function startCase(id){const c=caseById(id);state.view='player';state.caseId=id;state.q=0;state.answers=c.questions.map(()=>({attempts:0,wrong:[],hint:false,correct:false,points:0,choice:null}));state.feedback=null;window.scrollTo(0,0);render();announce(`已打开${c.title}`)}
    function answer(choice){const c=caseById(state.caseId),q=c.questions[state.q],a=state.answers[state.q];if(a.correct||a.wrong.includes(choice))return;const opt=q.options.find(o=>o.id===choice);if(choice===q.answer){a.correct=true;a.choice=choice;a.points=a.hint?30:a.attempts?60:100;state.feedback=q.reason;announce(`回答正确，本题 ${a.points} 分`)}else{a.attempts+=1;a.wrong.push(choice);state.feedback=opt.feedback;announce('当前选择还不能充分回答问题，请查看解释后重试')}render()}
    function next(){const c=caseById(state.caseId);if(state.q<c.questions.length-1){state.q+=1;state.feedback=null;window.scrollTo(0,0);render()}else{saveResult();state.view='result';window.scrollTo(0,0);render();announce('案例完成，成绩已保存到本机')}}
    function saveResult(){const {c,score,first,hinted,corrected}=resultData();const progress=getProgress();const old=progress[c.id]||{history:[]};const record={score,first,hinted,corrected,total:c.questions.length,ts:Date.now()};progress[c.id]={bestScore:Math.max(old.bestScore??0,score),lastScore:score,history:[...(old.history||[]),record].slice(-3)};if(!write(keys.progress,progress))state.toast='浏览器未能保存成绩'}
    function formatDate(ts){if(!ts)return'';return new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(ts))}
    function bindFields(){const form=document.getElementById('comment-form');if(!form)return;form.querySelectorAll('input,textarea,select').forEach(el=>el.addEventListener('input',()=>{state.comment[el.name]=el.value;state.preview=false}))}
    document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;if(action==='start')startCase(b.dataset.case);if(action==='answer')answer(b.dataset.choice);if(action==='hint'){const a=state.answers[state.q];a.hint=true;state.feedback=null;render();announce('提示已展开')}if(action==='next')next();if(action==='home'){state.view='shelf';state.feedback=null;window.scrollTo(0,0);render()}if(action==='restart')startCase(state.caseId);if(action==='nav-cases'){state.view='shelf';render();setTimeout(()=>document.getElementById('cases')?.scrollIntoView(),0)}if(action==='nav-history'){state.view='shelf';render();setTimeout(()=>document.getElementById('history')?.scrollIntoView(),0)}if(action==='nav-comments'){state.view='shelf';render();setTimeout(()=>document.getElementById('comments')?.scrollIntoView(),0)}if(action==='rate'){state.comment.rating=Number(b.dataset.rating);state.preview=false;render();setTimeout(()=>document.getElementById('comments')?.scrollIntoView({block:'center'}),0)}if(action==='preview-comment'){if(!state.comment.body.trim()){toast('先写下一句想法再预览');return}state.preview=true;render();setTimeout(()=>document.getElementById('comments')?.scrollIntoView({block:'center'}),0)}if(action==='edit-comment'){state.preview=false;render();setTimeout(()=>document.querySelector('[name="body"]')?.focus(),0)}if(action==='save-comment'){const entry={...state.comment,nickname:state.comment.nickname.trim()||'匿名值班员',body:state.comment.body.trim(),ts:Date.now()};const list=getComments();if(write(keys.comments,[...list,entry].slice(-30))){state.comment={caseId:entry.caseId,nickname:'',rating:5,body:''};state.preview=false;toast('留言已保存在这台设备');setTimeout(()=>document.getElementById('comments')?.scrollIntoView(),0)}else toast('浏览器未能保存留言')}if(action==='result-comment'){state.comment.caseId=state.caseId;state.view='shelf';render();setTimeout(()=>document.getElementById('comments')?.scrollIntoView(),0)}});
    if(navigator.modelContext?.registerTool){
      navigator.modelContext.registerTool({name:'list_ethics_cases',description:'列出医学伦理游戏中的案例与本机最佳成绩',inputSchema:{type:'object',properties:{}},execute:async()=>({content:[{type:'text',text:JSON.stringify(cases.map(c=>({id:c.id,title:c.title,theme:c.short,bestScore:getProgress()[c.id]?.bestScore??null})),null,2)}]})});
      navigator.modelContext.registerTool({name:'open_ethics_case',description:'在页面中打开指定医学伦理案例',inputSchema:{type:'object',properties:{caseId:{type:'string',enum:cases.map(c=>c.id)}},required:['caseId']},execute:async({caseId})=>{startCase(caseId);return{content:[{type:'text',text:`已打开：${caseById(caseId).title}`}]}}});
    }
    render();
  </script>
  <script src="enhancements.js"></script>
</body>
</html>
