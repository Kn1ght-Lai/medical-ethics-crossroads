name: Update public scores and comments

on:
  issues:
    types: [opened, edited, closed, reopened, deleted, labeled, unlabeled]
  push:
    branches: [main]
    paths:
      - 'community/**'
      - '.github/workflows/community.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: white-coat-community
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.repository == 'Kn1ght-Lai/medical-ethics-crossroads'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
    steps:
      - name: Read trusted source from main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test packet parsing and ranking
        run: node --test community/community.test.mjs
      - name: Rebuild the public snapshot
        run: node community/sync.mjs --publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
